name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

      - name: Dump synthesis diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          reports=()
          while IFS= read -r report; do
            reports+=("$report")
          done < <(find runs/wokwi -type f \( -name pre_synth_chk.rpt -o -name chk.rpt \) -print 2>/dev/null)

          if ((${#reports[@]} == 0)); then
            echo "::warning title=Synthesis diagnostics::No Yosys check reports were produced"
            exit 0
          fi

          for report in "${reports[@]}"; do
            echo "::notice title=Yosys report::$report"
            line_number=0
            detail_lines=0
            while IFS= read -r line; do
              line_number=$((line_number + 1))
              case "$line" in
                Warning:*|"Found and reported"*)
                  line="${line//'%'/'%25'}"
                  line="${line//$'\r'/'%0D'}"
                  line="${line//$'\n'/'%0A'}"
                  echo "::error file=$report,line=$line_number,title=Yosys check::$line"
                  detail_lines=8
                  continue
                  ;;
              esac
              if ((detail_lines > 0)); then
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                line="${line//$'\n'/'%0A'}"
                echo "::error file=$report,line=$line_number,title=Yosys detail::$line"
                detail_lines=$((detail_lines - 1))
              fi
            done < "$report"
          done

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
