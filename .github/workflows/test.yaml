name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          set -euo pipefail
          cd test
          make clean
          # phase5 is the Makefile's first target; sim generates results.xml.
          make sim

          if [[ ! -f results.xml ]]; then
            echo "::error::Test command did not produce test/results.xml"
            exit 1
          fi

          if grep -q '<failure' results.xml; then
            echo "::error::Test failures found in test/results.xml"
            exit 1
          fi

      - name: Run Phase 5 compiler and loader regressions
        run: |
          python3 -m unittest discover -s phase5_tests -v
          make -C test phase5

      - name: Test Summary
        if: always() && hashFiles('test/results.xml') != ''
        uses: test-summary/action@v2.4
        with:
          paths: test/results.xml

      - name: upload waveform and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
