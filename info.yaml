# Tiny Tapeout project information
project:
  title:        "Chimaera"      # Project title
  author:       "Aarush Lenka"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Event-driven programmable protocol transducer ASIC"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # Phase 4 target: 50 MHz

  # The competition allocation is 24 tiles. Current IHP support tools express
  # that rectangular allocation as 6 columns by 4 rows.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_chimaera"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "chimaera_input_frontend.v"
    - "chimaera_uart_program.v"
    - "chimaera_i2c_program.v"
    - "chimaera_spi_program.v"
    - "chimaera_port_b_program.v"
    - "chimaera_execution_engine.v"
    - "chimaera_reaction_cell.v"
    - "chimaera_config_spi.v"
    - "chimaera_program_loader.v"
    - "chimaera_host_interface.v"
    - "chimaera_generic_execution_engine.v"
    - "chimaera_program_runtime.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Port B protocol select bit 0 (Phase 4 bootstrap strap)"
  ui[1]: "Port B protocol select bit 1 (Phase 4 bootstrap strap)"
  ui[2]: "Host configuration CS (active low)"
  ui[3]: "Host configuration serial clock"
  ui[4]: "Host configuration data input"
  ui[5]: "Reserved host configuration input"
  ui[6]: "Reserved host configuration input"
  ui[7]: "Reserved host configuration input"

  # Outputs
  uo[0]: "Last received byte bit 0 / host configuration data output"
  uo[1]: "Last received protocol byte bit 1"
  uo[2]: "Last received protocol byte bit 2"
  uo[3]: "Last received protocol byte bit 3"
  uo[4]: "Last received protocol byte bit 4"
  uo[5]: "Last received protocol byte bit 5"
  uo[6]: "Last received protocol byte bit 6"
  uo[7]: "Last received protocol byte bit 7"

  # Bidirectional pins
  uio[0]: "Port A UART RX"
  uio[1]: "Port A UART TX"
  uio[2]: "Port A reserved"
  uio[3]: "Port A reserved"
  uio[4]: "Port B I2C SDA / SPI SCLK"
  uio[5]: "Port B I2C SCL / SPI MOSI"
  uio[6]: "Port B SPI MISO"
  uio[7]: "Port B SPI CS"

# Do not change!
yaml_version: 6
